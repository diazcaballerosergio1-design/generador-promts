<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generador Multifuncional de Prompts Universales</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Generador Multifuncional de Prompts</h1>
            <p>Selecciona una categoría, personaliza los campos y obtén un prompt optimizado para cualquier IA (ChatGPT, Claude, Gemini, NotebookLM, etc.).</p>
        </header>

        <main>
            <div class="form-group">
                <label for="categorySelect">Selecciona la Categoría:</label>
                <select id="categorySelect" onchange="actualizarCampos()">
                    <option value="codigo">💻 Programación / Desarrollo</option>
                    <option value="analisis">📊 Análisis de Datos / Documentos</option>
                    <option value="creativo">✍️ Creación de Contenido</option>
                    <option value="traduccion">🌍 Traducción y Localización</option>
                    <option value="resumen">📝 Resumen y Síntesis</option>
                    <option value="estrategia">🎯 Estrategia y Planificación</option>
                </select>
            </div>

            <!-- Contenedor dinámico para los campos según la categoría -->
            <div id="dynamicFields" class="form-group">
                <!-- Se llena mediante JavaScript -->
            </div>

            <div class="form-group">
                <label for="outputPrompt">Prompt Generado:</label>
                <textarea id="outputPrompt" readonly rows="8"></textarea>
                <button id="copyBtn" onclick="copiarPrompt()">Copiar al Portapapeles</button>
            </div>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
