<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generador Multifuncional de Prompts Universales</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Generador Multifuncional de Prompts</h1>
            <p>Crea prompts profesionales e hiper-enfocados para cualquier inteligencia artificial.</p>
        </header>

        <main>
            <!-- Selector de la IA de Destino -->
            <div class="form-group">
                <label for="aiSelect">🤖 ¿Para qué IA o plataforma está destinado?</label>
                <select id="aiSelect" onchange="actualizarPromptFinal()">
                    <option value="ChatGPT">ChatGPT (OpenAI)</option>
                    <option value="Claude">Claude (Anthropic)</option>
                    <option value="Gemini">Gemini (Google)</option>
                    <option value="NotebookLM">NotebookLM (Google)</option>
                    <option value="Canva">Canva AI (Diseño y Creatividad)</option>
                    <option value="Otra">Otra plataforma / IA general</option>
                </select>
            </div>

            <!-- Selector de Área de Trabajo -->
            <div class="form-group">
                <label for="categorySelect">💼 Selecciona el Área de Trabajo:</label>
                <select id="categorySelect" onchange="actualizarCampos()">
                    <option value="redes">📱 Redes Sociales y Contenido</option>
                    <option value="freelance">💼 Trabajo Freelance y Negocios</option>
                    <option value="oficios">🔧 Oficios y Servicios Técnicos</option>
                    <option value="estrategia">🎯 Estrategia y Planificación</option>
                    <option value="analisis">📊 Análisis de Datos y Documentos</option>
                    <option value="codigo">💻 Desarrollo y Tecnología</option>
                    <option value="traduccion">🌍 Traducción y Localización</option>
                </select>
            </div>

            <!-- Campo libre para el Rol, Profesión u Oficio -->
            <div class="form-group">
                <label for="inputProfesion">¿Qué rol, profesión u oficio adoptará la IA? (Libre elección):</label>
                <input type="text" id="inputProfesion" placeholder="Ej. Electricista, Diseñador Gráfico, Abogado, Community Manager, Carpintero...">
                <small style="color: #64748b; font-size: 0.85rem; margin-top: 4px; display: block;">Escribe el rol que desees para calibrar la perspectiva y el tono de la respuesta.</small>
            </div>

            <!-- Contenedor dinámico según la categoría -->
            <div id="dynamicFields">
                <!-- Se rellena vía JavaScript -->
            </div>

            <!-- Opción Adicional y Opcional para Imágenes -->
            <div class="form-group optional-section" style="background: #f1f5f9; padding: 15px; border-radius: 8px; border: 1px dashed #cbd5e1;">
                <label style="display: flex; align-items: center; gap: 8px; cursor: pointer; margin-bottom: 0;">
                    <input type="checkbox" id="checkImagen" onchange="toggleSeccionImagen()" style="width: auto;">
                    <span>🖼️ Incluir análisis, mejora o generación de imagen (Opcional)</span>
                </label>
                
                <div id="imagenCampos" style="display: none; margin-top: 12px;">
                    <div style="margin-bottom: 10px;">
                        <label for="tipoImagen">Tipo de imagen o diseño:</label>
                        <input type="text" id="tipoImagen" placeholder="Ej. Fotografía de producto, plantilla de Canva, diagrama, boceto" oninput="actualizarPromptFinal()">
                    </div>
                    <div>
                        <label for="guiaMejora">Guía o aspecto visual a mejorar:</label>
                        <textarea id="guiaMejora" rows="2" placeholder="Ej. Mejorar iluminación, optimizar distribución, verificar diseño visual" oninput="actualizarPromptFinal()"></textarea>
                    </div>
                </div>
            </div>

            <!-- Sección de Salida y Botones Interactivos -->
            <div class="form-group output-section" style="margin-top: 20px;">
                <label for="outputPrompt">Prompt Generado Optimizado:</label>
                <textarea id="outputPrompt" readonly rows="8"></textarea>
                
                <div class="button-group">
                    <button id="copyBtn" class="btn-primary" onclick="copiarPrompt()">📋 Copiar Prompt</button>
                    <button id="clearBtn" class="btn-secondary" onclick="limpiarCampos()">🧹 Limpiar Campos</button>
                </div>
            </div>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
